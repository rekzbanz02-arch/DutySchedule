<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duty Schedule – Full Auto System</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    padding: 15px;
}

h1 { text-align: center; }

.controls {
    text-align: center;
    margin-bottom: 15px;
}

input, button {
    padding: 8px;
    margin: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    margin-top: 15px;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
}

th {
    background: #222;
    color: white;
}

/* TEAM COLORS */
.t1 { background: #f3d0f5; font-weight: bold; }
.t2 { background: #d0f5d4; font-weight: bold; }
.t3 { background: #d0e8f5; font-weight: bold; }

.duty {
    color: #2c7be5;
    font-size: 12px;
    display: block;
}

.off {
    color: red;
    font-size: 12px;
    display: block;
}

/* SUMMARY */
.summary {
    margin-top: 5px;
}

.summary td {
    font-weight: bold;
}
</style>
</head>

<body>

<h1>Duty Schedule (Auto Generated)</h1>

<div class="controls">
    <input type="date" id="startDate">
    <input type="number" id="days" placeholder="Number of days">
    <br>
    <button onclick="generate()">Generate</button>
    <button onclick="clearAll()">Clear</button>
</div>

<div id="output"></div>

<script>
// TEAMS
const teams = [
  { name: "TEAM 1", cls: "t1" },
  { name: "TEAM 2", cls: "t2" },
  { name: "TEAM 3", cls: "t3" }
];

// SHIFT TIMES
const shiftStart = [6, 14, 22];
const shiftEnd = [14, 22, 30];

// ARRANGEMENTS
const arrangements = [
  { name: "No Rotation", perm: [0,1,2] },
  { name: "Forward Rotation", perm: [1,2,0] },
  { name: "Backward Rotation", perm: [2,0,1] },
  { name: "Swap 2nd & 3rd", perm: [0,2,1] },
  { name: "Swap 1st & 2nd", perm: [1,0,2] },
  { name: "Swap 1st & 3rd", perm: [2,1,0] }
];

// APPLY PERMUTATION
function applyPerm(arr, perm) {
  let next = [];
  for (let i = 0; i < 3; i++) next[perm[i]] = arr[i];
  return next;
}

// GENERATE SCHEDULE
function generate() {
  let startDate = new Date(document.getElementById("startDate").value);
  let totalDays = parseInt(document.getElementById("days").value);

  if (!startDate || !totalDays) {
    alert("Enter date and days!");
    return;
  }

  const output = document.getElementById("output");
  output.innerHTML = "";

  arrangements.forEach((arrangement, idx) => {

    let schedule = [];
    let current = [0,1,2];
    let dutyTotals = [0, 0, 0];

    for (let i = 0; i < totalDays; i++) {
      schedule.push([...current]);
      current = applyPerm(current, arrangement.perm);
    }

    let table = document.createElement("table");

    table.innerHTML = `
      <thead>
        <tr>
          <th colspan="4">${idx+1}. ${arrangement.name}</th>
        </tr>
        <tr>
          <th>Date</th>
          <th>1st Shift</th>
          <th>2nd Shift</th>
          <th>3rd Shift</th>
        </tr>
      </thead>
    `;

    let tbody = document.createElement("tbody");

    for (let i = 0; i < totalDays; i++) {
      let tr = document.createElement("tr");

      let d = new Date(startDate);
      d.setDate(startDate.getDate() + i);

      tr.innerHTML = `<td>${d.toDateString()}</td>`;

      let today = schedule[i];
      let next = schedule[i + 1];

      for (let shift = 0; shift < 3; shift++) {
        let teamIndex = today[shift];

        dutyTotals[teamIndex] += 8;

        let content = `<strong>${teams[teamIndex].name}</strong>`;
        content += `<span class="duty">8 hrs DUTY</span>`;

        if (next) {
          let nextShift = next.indexOf(teamIndex);

          let end = shiftEnd[shift];
          let start = shiftStart[nextShift] + 24;

          let offHours = start - end;

          content += `<span class="off">${offHours} hrs OFF</span>`;
        }

        tr.innerHTML += `
          <td class="${teams[teamIndex].cls}">
            ${content}
          </td>
        `;
      }

      tbody.appendChild(tr);
    }

    table.appendChild(tbody);
    output.appendChild(table);

    // SUMMARY
    let summary = document.createElement("table");
    summary.className = "summary";

    summary.innerHTML = `
      <thead>
        <tr>
          <th colspan="3">Total Duty Hours</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="t1">TEAM 1: ${dutyTotals[0]} hrs</td>
          <td class="t2">TEAM 2: ${dutyTotals[1]} hrs</td>
          <td class="t3">TEAM 3: ${dutyTotals[2]} hrs</td>
        </tr>
      </tbody>
    `;

    output.appendChild(summary);
  });
}

// CLEAR
function clearAll() {
  document.getElementById("output").innerHTML = "";
}

// AUTO LOAD DEFAULT
window.onload = function () {
    const today = new Date();

    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');

    document.getElementById("startDate").value = `${yyyy}-${mm}-${dd}`;
    document.getElementById("days").value = 7;

    generate();
};
</script>

</body>
</html>
