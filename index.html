<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duty Schedule – Full Auto System</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    padding: 15px;
}

h1 { text-align: center; }

/* ✅ CONTROLS IN ONE ROW */
.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
    gap: 10px;
    margin-bottom: 15px;
}

/* INPUT GROUP */
.input-group {
    display: flex;
    flex-direction: column;
    font-size: 13px;
}

.input-group label {
    margin-bottom: 3px;
    font-weight: bold;
}

/* INPUT SIZES */
input[type="date"] {
    padding: 8px;
    width: 160px;
}

input[type="number"] {
    padding: 8px;
    width: 110px;
}

/* BUTTONS */
button {
    padding: 9px 14px;
    cursor: pointer;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    margin-top: 15px;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
}

th {
    background: #222;
    color: white;
}

/* TEAM COLORS */
.t1 { background: #f3d0f5; font-weight: bold; }
.t2 { background: #d0f5d4; font-weight: bold; }
.t3 { background: #d0e8f5; font-weight: bold; }

.duty {
    color: #2c7be5;
    font-size: 12px;
    display: block;
}

.off {
    color: red;
    font-size: 12px;
    display: block;
}

.summary {
    margin-top: 5px;
}

.summary td {
    font-weight: bold;
}

/* MOBILE */
@media (max-width: 600px) {
    .controls {
        flex-direction: column;
        align-items: stretch;
    }

    input, button {
        width: 100%;
    }
}
</style>
</head>

<body>

<h1>Duty Schedule (Auto Generated)</h1>

<div class="controls">

    <!-- INPUTS ROW -->
    <div style="display: flex; gap: 10px; justify-content: center;">
        <div class="input-group">
            <label>Starting Date</label>
            <input type="date" id="startDate" style="width: 160px;">
        </div>

        <div class="input-group">
            <label>No. of Days</label>
            <input type="number" id="days" placeholder="e.g. 7" style="width: 80px;">
        </div>
    </div>

    <!-- BUTTONS ROW -->
    <div style="margin-top: 10px; display: flex; justify-content: center; gap: 10px;">
    <button onclick="generate()">Generate</button>
    <button onclick="clearAll()">Clear</button>
</div>

</div>

<div id="output"></div>

<script>
const teams = [
  { name: "TEAM 1", cls: "t1" },
  { name: "TEAM 2", cls: "t2" },
  { name: "TEAM 3", cls: "t3" }
];

const shiftStart = [6, 14, 22];
const shiftEnd = [14, 22, 30];

const arrangements = [
  { name: "No Rotation", perm: [0,1,2] },
  { name: "Forward Rotation", perm: [1,2,0] },
  { name: "Backward Rotation", perm: [2,0,1] },
  { name: "Swap 2nd & 3rd", perm: [0,2,1] },
  { name: "Swap 1st & 2nd", perm: [1,0,2] },
  { name: "Swap 1st & 3rd", perm: [2,1,0] }
];

function applyPerm(arr, perm) {
  let next = [];
  for (let i = 0; i < 3; i++) next[perm[i]] = arr[i];
  return next;
}

function formatDateWithDay(date) {
  return date.toLocaleDateString("en-US", {
    weekday: "short",
    month: "short",
    day: "numeric",
    year: "numeric"
  });
}

function generate() {
  let startDate = new Date(document.getElementById("startDate").value);
  let totalDays = parseInt(document.getElementById("days").value);

  if (!startDate || !totalDays) {
    alert("Enter date and days!");
    return;
  }

  const output = document.getElementById("output");
  output.innerHTML = "";

  generateImagePattern();

  arrangements.forEach((arrangement, idx) => {

    let schedule = [];
    let current = [0,1,2];
    let dutyTotals = [0, 0, 0];

    for (let i = 0; i < totalDays; i++) {
      schedule.push([...current]);
      current = applyPerm(current, arrangement.perm);
    }

    let table = document.createElement("table");

    table.innerHTML = `
      <thead>
        <tr>
          <th colspan="4">${idx+2}. ${arrangement.name}</th>
        </tr>
        <tr>
          <th>Date</th>
          <th>1st Shift</th>
          <th>2nd Shift</th>
          <th>3rd Shift</th>
        </tr>
      </thead>
    `;

    let tbody = document.createElement("tbody");

    for (let i = 0; i < totalDays; i++) {
      let tr = document.createElement("tr");

      let d = new Date(startDate);
      d.setDate(startDate.getDate() + i);

      tr.innerHTML = `<td>${formatDateWithDay(d)}</td>`;

      let today = schedule[i];
      let next = schedule[i + 1];

      for (let shift = 0; shift < 3; shift++) {
        let teamIndex = today[shift];
        dutyTotals[teamIndex] += 8;

        let content = `<strong>${teams[teamIndex].name}</strong>`;
        content += `<span class="duty">8 hrs DUTY</span>`;

        if (next) {
          let nextShift = next.indexOf(teamIndex);
          let offHours = (shiftStart[nextShift] + 24) - shiftEnd[shift];
          content += `<span class="off">${offHours} hrs OFF</span>`;
        }

        tr.innerHTML += `<td class="${teams[teamIndex].cls}">${content}</td>`;
      }

      tbody.appendChild(tr);
    }

    table.appendChild(tbody);
    output.appendChild(table);

    let summary = document.createElement("table");
    summary.className = "summary";

    summary.innerHTML = `
      <thead>
        <tr><th colspan="3">Total Duty Hours</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="t1">TEAM 1: ${dutyTotals[0]} hrs</td>
          <td class="t2">TEAM 2: ${dutyTotals[1]} hrs</td>
          <td class="t3">TEAM 3: ${dutyTotals[2]} hrs</td>
        </tr>
      </tbody>
    `;

    output.appendChild(summary);
  });
}

function generateImagePattern() {
  let startDate = new Date(document.getElementById("startDate").value);
  let totalDays = parseInt(document.getElementById("days").value);

  if (!startDate || !totalDays) return;

  const output = document.getElementById("output");

  let table = document.createElement("table");
  table.innerHTML = `
    <thead>
      <tr><th colspan="4">1. Backward Rotation - 2</th></tr>
      <tr>
        <th>Date</th>
        <th>1st Shift</th>
        <th>2nd Shift</th>
        <th>3rd Shift</th>
      </tr>
    </thead>
  `;

  let tbody = document.createElement("tbody");
  let dutyTotals = [0, 0, 0];

  const cycle = [
    [0, 1, 2],
    [1, 2, 0],
    [2, 0, 1],
  ];

  for (let i = 0; i < totalDays; i++) {
    let d = new Date(startDate);
    d.setDate(startDate.getDate() + i);

    let blockIndex = Math.floor(i / 2) % 3;
    let assignment = cycle[blockIndex];

    let nextBlockIndex = Math.floor((i + 1) / 2) % 3;
    let nextAssignment = cycle[nextBlockIndex];
    let isLastDay = (i === totalDays - 1);

    let tr = document.createElement("tr");
    tr.innerHTML = `<td>${formatDateWithDay(d)}</td>`;

    for (let shift = 0; shift < 3; shift++) {
      let teamIndex = assignment[shift];
      dutyTotals[teamIndex] += 8;

      let content = `<strong>${teams[teamIndex].name}</strong>`;
      content += `<span class="duty">8 hrs DUTY</span>`;

      if (!isLastDay) {
        let nextShift = nextAssignment.indexOf(teamIndex);
        let offHrs = (shiftStart[nextShift] + 24) - shiftEnd[shift];
        content += `<span class="off">${offHrs} hrs OFF</span>`;
      }

      tr.innerHTML += `<td class="${teams[teamIndex].cls}">${content}</td>`;
    }

    tbody.appendChild(tr);
  }

  table.appendChild(tbody);
  output.appendChild(table);

  let summary = document.createElement("table");
  summary.className = "summary";
  summary.innerHTML = `
    <thead>
      <tr><th colspan="3">Total Duty Hours</th></tr>
    </thead>
    <tbody>
      <tr>
        <td class="t1">TEAM 1: ${dutyTotals[0]} hrs</td>
        <td class="t2">TEAM 2: ${dutyTotals[1]} hrs</td>
        <td class="t3">TEAM 3: ${dutyTotals[2]} hrs</td>
      </tr>
    </tbody>
  `;
  output.appendChild(summary);
}

function clearAll() {
  document.getElementById("output").innerHTML = "";
}

window.onload = function () {
    const today = new Date();
    document.getElementById("startDate").value = "2026-03-20";         //* today.toISOString().split('T')[0]; *//
    document.getElementById("days").value = 12;
    generate();
};
</script>

</body>
</html>
